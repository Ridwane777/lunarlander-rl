env: LunarLander-v3
algo: dqn_hard
seeds: [0, 1, 2, 3, 4]
max_steps: 500000
success_threshold: 200
success_window: 100

hyperparameters:
  gamma: 0.99
  lr: 0.0003
  batch_size: 128
  buffer_size: 100000
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  update_every: 4
  target_update_freq: 500
  soft_update: false
  tau: 0.02
  hidden: 128
  grad_clip: 1.0
