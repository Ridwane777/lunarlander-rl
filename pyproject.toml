[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarlander-rl"
version = "1.0.0"
description = "Learning to land on the Moon from scratch: Q-Learning, REINFORCE and DQN on LunarLander-v3, against a rule-based controller"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ridwane777" }
]
dependencies = [
    "gymnasium[box2d]",
    "torch",
    "matplotlib",
    "numpy",
    "pyyaml",
    "moviepy",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
